name: Publicar web
on:
  push:
    branches: [main]
    paths:
      - '*.zip'
      - 'redesign.cjs'
      - 'en-el-abismo/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PAGES_ARTIFACT: github-pages-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Extraer web y aplicar diseño
        run: |
          mkdir -p _site
          unzip -q enlascenizas-github-pages-2026-11-08.zip -d _site
          test -f _site/index.html
          node --check redesign.cjs
          node redesign.cjs _site
          python3 .github/scripts/cache-itch-images.py
          node --check _site/site.js
          node --check _site/en-el-abismo/abismo.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          name: ${{ env.PAGES_ARTIFACT }}
      - name: Esperar a que Pages pueda localizar el paquete
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..8}; do
            artifact_ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$PAGES_ARTIFACT" --jq '.artifacts[] | select(.expired == false) | .id')
            if [[ -n "$artifact_ids" ]]; then exit 0; fi
            if [[ "$attempt" -lt 8 ]]; then sleep 3; fi
          done
          echo "::error::GitHub Pages no puede localizar el paquete $PAGES_ARTIFACT."
          exit 1
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT }}

